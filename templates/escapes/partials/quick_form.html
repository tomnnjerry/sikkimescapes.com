<form class="panel form" method="post" action="{% url 'plan' %}" data-cta-form="{{ qf_id|default:'quick' }}" style="color:var(--ink)">
  {% csrf_token %}
  <div><h3 style="margin:0">{{ qf_title|default:"Get a day-by-day plan and price" }}</h3>
  <p class="small muted" style="margin:4px 0 0">{{ qf_sub|default:"Within one working day. No payment to start." }}</p></div>
  <input type="hidden" name="kind" value="{{ qf_kind|default:'quick' }}">
  <input type="hidden" name="source_page" value="{{ request.path }}">
  {% if qf_land %}<input type="hidden" name="lands" value="{{ qf_land }}">{% endif %}
  {% if qf_message %}<input type="hidden" name="message" value="{{ qf_message }}">{% endif %}
  <input type="text" name="website" class="sr" tabindex="-1" autocomplete="off" aria-hidden="true">
  <div class="field"><label for="{{ qf_id|default:'quick' }}-name">Name</label><input id="{{ qf_id|default:'quick' }}-name" name="name" required autocomplete="name"></div>
  <div class="form-grid">
    <div class="field"><label for="{{ qf_id|default:'quick' }}-email">Email</label><input id="{{ qf_id|default:'quick' }}-email" name="email" type="email" required autocomplete="email"></div>
    <div class="field"><label for="{{ qf_id|default:'quick' }}-phone">Phone or WhatsApp</label><input id="{{ qf_id|default:'quick' }}-phone" name="phone" type="tel" autocomplete="tel"></div>
    <div class="field"><label for="{{ qf_id|default:'quick' }}-month">Month</label><select id="{{ qf_id|default:'quick' }}-month" name="month"><option value="">Flexible</option><option>January</option><option>February</option><option>March</option><option>April</option><option>May</option><option>June</option><option>July</option><option>August</option><option>September</option><option>October</option><option>November</option><option>December</option></select></div>
    <div class="field"><label for="{{ qf_id|default:'quick' }}-pax">Travellers</label><input id="{{ qf_id|default:'quick' }}-pax" name="travellers" type="number" min="1" max="30" value="2" inputmode="numeric"></div>
  </div>
  <button class="btn btn--foil" type="submit">{{ qf_button|default:"Send to the Gangtok desk" }}</button>
  <p class="small muted" style="margin:0">We reply by email{% if wa_base %} or WhatsApp{% endif %}. See our <a href="{% url 'policy' 'privacy' %}">privacy policy</a>.</p>
</form>
