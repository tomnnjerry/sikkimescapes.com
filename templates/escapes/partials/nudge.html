<aside class="nudge" data-nudge hidden aria-label="Planning help">
  <button type="button" data-nudge-close aria-label="Close">×</button>
  <p class="kicker" style="margin-bottom:6px">Reading up on {{ nudge_land|default:"Sikkim" }}?</p>
  <p style="font:400 1.15rem/1.25 var(--serif);margin:0 0 12px">We can turn this into a priced, day-by-day plan for your dates</p>
  <a class="btn btn--sm btn--foil" href="{% url 'plan' %}?from={{ request.path|urlencode }}{% if nudge_slug %}&land={{ nudge_slug }}{% endif %}" data-cta="nudge-plan">Get my price</a>
</aside>
